name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sched-ext/scx
          path: third_party/scx
          ref: 67be0435c454dc8984a11064dc8b9c6476c46b6d
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libelf-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: find scripts benchmarks tests -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning
