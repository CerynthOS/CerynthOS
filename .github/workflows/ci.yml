name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sched-ext/scx
          path: third_party/scx
          ref: 67be0435c454dc8984a11064dc8b9c6476c46b6d
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libelf-dev libseccomp-dev zlib1g-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - name: Agent runtime strict lint
        run: >-
          cargo clippy --locked --no-deps
          -p cerynth-agent-api -p cerynth-agent-protocols
          -p cerynth-adapter-cli-harnesses -p cerynth-adapter-generic-pty
          -p cerynth-model-api -p cerynth-resources
          -p cerynth-agentd -p cerynth-inferenced -p cerynthd
          --all-targets -- -D warnings
      - name: Agent contract drift
        run: scripts/check-agent-contracts.sh
      - name: Cloud consent preflight and real coordinator policy checks
        run: |
          cargo build --locked -p cerynth-inferenced --bin cerynth-inferenced
          python3 -m unittest discover -s tools -p test_cloud_routing_smoke.py -v
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: find scripts benchmarks tests -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning
