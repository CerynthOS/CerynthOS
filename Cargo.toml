[workspace]
resolver = "2"
members = [
    "cli/cerynthctl",
    "crates/cerynth-common",
    "crates/cerynth-config",
    "crates/cerynth-ipc",
    "crates/cerynth-policy",
    "crates/cerynth-telemetry",
    "services/cerynthd",
    "schedulers/cerynth-scx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["The CerynthOS Contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
config = "0.15"
libc = "0.2"
nix = { version = "0.30", features = ["signal", "process", "sched", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
