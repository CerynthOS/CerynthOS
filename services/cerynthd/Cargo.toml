[package]
name = "cerynthd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
cerynth-ipc = { path = "../../crates/cerynth-ipc" }
cerynth-config = { path = "../../crates/cerynth-config" }
cerynth-platform-resources = { path = "../../crates/cerynth-platform-resources" }

anyhow.workspace = true
libc.workspace = true
nix = { version = "0.30", features = ["fs", "signal", "process", "sched", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
